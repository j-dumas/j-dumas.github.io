{{ define "main_article" }}
    <article class="main">
        <div class="home">
            <div class="title">
                {{ with $.Site.Params.header.logo.imgUrl }}
                    <img class="logo" src="{{ $.Site.BaseURL }}{{ . }}" />
                {{ end }}

                <div class="flex-title">
                    {{ with $.Site.Params.header.title }}
                        <h1 class="title-caption">{{ . }}</h1>
                    {{ end }}

                    <div>
                        <a href="https://github.com/j-dumas" target="_blank">
                            <img src="https://skillicons.dev/icons?i=github" />
                        </a>
                        <a href="https://www.linkedin.com/in/j-dumas/" target="_blank">
                            <img src="https://skillicons.dev/icons?i=linkedin" />
                        </a>
                    </div>
                </div>

                {{ with $.Site.Params.header.subtitle }}
                    <h2 class="subtitle">
                        {{ . }}
                    </h2>
                {{ end }}

            </div>
        </div>

        <div class="content">
            {{ .Content }}
        </div>

        <div class="home-cards">
            {{ range $.Params.cards }}
                <a class="home-card {{ .accent }} {{ if .featured }}featured{{ end }}" href="{{ .link }}">
                    <div class="home-card-content">
                        <h2>{{ .title }}</h2>
                        <p>{{ .description }}</p>
                    </div>

                    <span class="home-card-arrow">↗</span>
                </a>
            {{ end }}
        </div>

        <!--  <p align="center"> -->
        <!--     <a href="https://skillicons.dev" target="_blank"> -->
        <!--         <img src="https://skillicons.dev/icons?i=c,cpp,zig,python,neovim,linux,latex&perline=7" /> -->
        <!--     </a> -->
        <!-- </p> -->

    </article>
{{ end }}
