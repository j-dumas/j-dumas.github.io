{{ define "main_article" }}
    <article class="main">
        <div class="title">
            <h1 class="title-header">{{ .Title }}</h1>
        </div>

        <hr />

        <div class="content">
            {{ if .Content }}
                {{ .Content }}
            {{ end }}
        </div>


        <div class="list-files">
            {{ partial "module/section_tree" ( dict "context" . "currentPage" . "showSummary" true ) }}
        </div>
    </article>
{{ end }}
