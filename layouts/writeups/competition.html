{{ define "main_article" }}
    <article class="main">
        <div class="title">
            <h1 class="title-header">{{ .Title }}</h1>
        </div>

        <hr />

        <div class="content">
            {{ with .Content }}{{ . }}{{ end }}
        </div>

        <div class="list-files">
            {{ partial "module/section_tree_solved" . }}
        </div>
    </article>
{{ end }}
